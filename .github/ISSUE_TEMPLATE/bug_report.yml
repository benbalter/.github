name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: textarea
    id: bug
    attributes:
      label: What happened?
      description: What went wrong, including any error messages.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, input, or configuration that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the project you're using, and relevant environment details (OS, runtime version, browser).
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, logs, or links that might help. You can drag and drop files here.
